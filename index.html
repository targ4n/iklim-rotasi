<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>İklim Rotası</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Lexend:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Tek, parlak bir oyun dünyası: üstte animasyonlu şehir sahnesi, altında rehber karakter ve görev alanı. */
:root {
  --bg: #d9eefc;
  --panel: #ffffff;
  --ink: #1b2a4a;
  --muted: #56688a;
  --line: #cfe1f0;
  --blue: #1e88e5; --blue-d: #1262b3;
  --green: #22a866; --green-d: #16794a;
  --orange: #ff9a1f; --orange-d: #c96f00;
  --red: #ec4f4c; --red-d: #b02a28;
  --purple: #7c55c7; --purple-d: #573799;
  --yellow: #ffd23f; --yellow-d: #d9a900;
  --flood: #2f8fd8;
  --font-d: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --font-b: "Lexend", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
body { background: var(--bg); background-image: radial-gradient(circle at 20% 0%, #eaf7ff 0, transparent 50%), radial-gradient(circle at 90% 30%, #e6f4ff 0, transparent 40%); color: var(--ink); font-family: var(--font-b); font-size: 17px; line-height: 1.55; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 56px; }
h1, h2, h3 { font-family: var(--font-d); line-height: 1.1; margin: 0; text-wrap: balance; }
p { margin: 0; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 4px solid var(--yellow); outline-offset: 3px; }
.gizli { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Oyun düğmeleri */
.btn { --c: var(--blue); --cd: var(--blue-d); display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 16px; padding: 12px 22px; background: var(--c); color: #fff; font-family: var(--font-d); font-weight: 700; font-size: 1.15rem; line-height: 1.1; cursor: pointer; box-shadow: 0 5px 0 var(--cd); transition: transform .08s, box-shadow .08s, filter .15s; }
.btn:hover { filter: brightness(1.07); }
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--cd); }
.btn.yesil { --c: var(--green); --cd: var(--green-d); }
.btn.turuncu { --c: var(--orange); --cd: var(--orange-d); }
.btn.beyaz { --c: #fff; --cd: var(--line); color: var(--ink); }
.btn.kucuk { padding: 8px 14px; font-size: 1rem; border-radius: 13px; box-shadow: 0 4px 0 var(--cd); }
.btn.ikon { padding: 8px 10px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; filter: grayscale(.4); }
.btn.buyuk { font-size: 1.5rem; padding: 16px 34px; border-radius: 20px; box-shadow: 0 7px 0 var(--cd); }
.ziplayan { animation: zipla 1.6s ease-in-out infinite; }
@keyframes zipla { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

/* Üst gösterge çubuğu (HUD) */
.hud { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; padding: 10px 14px; margin-bottom: 16px; background: rgba(255,255,255,.94); border-radius: 0 0 20px 20px; box-shadow: 0 4px 0 var(--line); }
.hud-marka { display: flex; align-items: center; gap: 8px; font-family: var(--font-d); font-weight: 800; font-size: 1.3rem; }
.hud-dugmeler { display: flex; gap: 8px; }
.rota { display: flex; align-items: center; gap: 0; }
.rota-nokta { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-d); font-weight: 800; font-size: .95rem; background: var(--line); color: var(--muted); flex: none; }
.rota-nokta.tamam { background: var(--green); color: #fff; }
.rota-nokta.simdi { background: var(--yellow); color: var(--ink); box-shadow: 0 0 0 4px rgba(255,210,63,.4); animation: zipla 1.4s ease-in-out infinite; }
.rota-cizgi { width: 14px; height: 4px; background: var(--line); }
.rota-cizgi.tamam { background: var(--green); }
.metreler { display: flex; gap: 14px; flex-wrap: wrap; }
.metre { position: relative; display: flex; align-items: center; gap: 6px; min-width: 128px; }
.metre-ikon { width: 30px; height: 30px; flex: none; }
.metre-govde { flex: 1; }
.metre-ust { display: flex; justify-content: space-between; font-size: .72rem; font-weight: 600; color: var(--muted); line-height: 1.2; gap: 6px; }
.metre-ust b { color: var(--ink); font-variant-numeric: tabular-nums; }
.metre-cubuk { height: 12px; border-radius: 6px; background: #e6eef6; overflow: hidden; margin-top: 3px; box-shadow: inset 0 2px 0 rgba(0,0,0,.06); }
.metre-dolu { height: 100%; border-radius: 6px; transition: width .8s cubic-bezier(.3,1.4,.5,1), background .4s; }
.ucan { position: absolute; right: 0; top: -6px; font-family: var(--font-d); font-weight: 800; font-size: 1.1rem; pointer-events: none; animation: uc 1.4s ease-out forwards; }
@keyframes uc { 0% { opacity: 0; transform: translateY(8px) scale(.6); } 20% { opacity: 1; transform: translateY(0) scale(1.15); } 100% { opacity: 0; transform: translateY(-34px) scale(1); } }
@media (max-width: 640px) { .hud { position: relative; top: 0; } .hud-marka span { display: none; } }
@media (max-width: 760px) { .metre { min-width: 0; flex: 1 1 90px; } .metre-ust span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .metreler { width: 100%; gap: 10px; } .rota-cizgi { width: 8px; } .rota-nokta { width: 24px; height: 24px; font-size: .85rem; } }
.onay { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; background: #fff6d6; border: 3px solid var(--yellow); border-radius: 18px; padding: 12px 16px; margin-bottom: 16px; }
.onay p { flex: 1 1 220px; font-weight: 600; }

/* Sahne */
.sahne-kutu { position: relative; border-radius: 26px; overflow: hidden; border: 4px solid #fff; box-shadow: 0 8px 0 rgba(27,42,74,.14); aspect-ratio: 1000 / 420; background: #9fd4f5; }
.sahne-svg { width: 100%; height: 100%; display: block; }
@media (max-width: 640px) { .sahne-kutu { aspect-ratio: 16 / 10; } }
.damla-yagmur { animation: dus linear infinite; }
@keyframes dus { from { transform: translateY(-60px); } to { transform: translateY(470px); } }
.bulut { animation: suzul linear infinite; }
@keyframes suzul { from { transform: translateX(-260px); } to { transform: translateX(1120px); } }
.dalga { animation: dalga 3s linear infinite; }
@keyframes dalga { to { transform: translateX(-80px); } }
.yuksel { animation: yuksel 2.2s cubic-bezier(.2,.8,.3,1) both; }
@keyframes yuksel { from { transform: translateY(110px); } to { transform: none; } }
.sallan { transform-box: fill-box; transform-origin: 50% 100%; animation: sallan 3.2s ease-in-out infinite; }
@keyframes sallan { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
.araba-git { animation: araba 9s linear infinite; }
@keyframes araba { from { transform: translateX(-140px); } to { transform: translateX(1140px); } }
.simsek { animation: simsek 7s linear infinite; opacity: 0; }
@keyframes simsek { 0%, 90%, 100% { opacity: 0; } 91% { opacity: .85; } 92.5% { opacity: .1; } 93.5% { opacity: .7; } 95% { opacity: 0; } }
.gunes-isin { transform-box: fill-box; transform-origin: center; animation: don 18s linear infinite; }
@keyframes don { to { transform: rotate(360deg); } }
.bayrak { transform-box: fill-box; transform-origin: 0 50%; animation: bayrak 1.2s ease-in-out infinite; }
@keyframes bayrak { 0%, 100% { transform: skewY(0); } 50% { transform: skewY(8deg) scaleX(.92); } }
.parilti { stroke-dasharray: 10 22; animation: akis 1.6s linear infinite; }
@keyframes akis { to { stroke-dashoffset: -64; } }
.belir { animation: belir 1.4s ease both; }
@keyframes belir { from { opacity: 0; } }
.sahne-baslik { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 4%; text-align: center; pointer-events: none; }
.sahne-baslik h1 { font-size: clamp(2.4rem, 8vw, 5rem); font-weight: 800; color: #fff; letter-spacing: .01em; text-shadow: 0 4px 0 var(--ink), 3px 0 0 var(--ink), -3px 0 0 var(--ink), 0 -3px 0 var(--ink), 0 8px 0 rgba(27,42,74,.25); animation: baslikGel .9s cubic-bezier(.3,1.6,.5,1) both; }
.sahne-baslik .alt { margin-top: 6px; background: var(--yellow); color: var(--ink); font-family: var(--font-d); font-weight: 700; font-size: clamp(.9rem, 2.4vw, 1.2rem); padding: 4px 16px; border-radius: 999px; box-shadow: 0 4px 0 var(--yellow-d); }
@keyframes baslikGel { from { opacity: 0; transform: scale(.4) rotate(-6deg); } }
.damga { position: absolute; top: 14px; right: 14px; font-family: var(--font-d); font-weight: 800; font-size: clamp(1.1rem, 3vw, 1.7rem); text-transform: uppercase; letter-spacing: .04em; padding: 6px 18px; border-radius: 14px; border: 4px solid currentColor; background: rgba(255,255,255,.92); transform: rotate(-7deg); animation: damga .55s cubic-bezier(.3,1.6,.5,1) .4s both; }
.damga.iyi { color: var(--green); } .damga.orta { color: var(--orange-d); } .damga.kotu { color: var(--red); }
@keyframes damga { from { opacity: 0; transform: rotate(-7deg) scale(2.6); } }

/* Rehber karakter ve konuşma balonu */
.anlatici { display: flex; align-items: flex-start; gap: 10px; margin-top: -78px; position: relative; z-index: 3; padding-left: 10px; }
.karakter { flex: none; width: 120px; filter: drop-shadow(0 4px 0 rgba(27,42,74,.15)); }
.karakter svg { width: 100%; height: auto; display: block; }
.damla-govde { animation: suzulKarakter 2.6s ease-in-out infinite; }
@keyframes suzulKarakter { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
.goz { transform-box: fill-box; transform-origin: center; animation: kirp 4.5s infinite; }
@keyframes kirp { 0%, 94%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
.el-salla { transform-box: fill-box; transform-origin: 0% 100%; animation: salla .8s ease-in-out infinite alternate; }
@keyframes salla { from { transform: rotate(-12deg); } to { transform: rotate(16deg); } }
.gozyasi { animation: damlat 1.8s ease-in infinite; }
@keyframes damlat { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(16px); opacity: 0; } }
.balon { position: relative; flex: 1; min-width: 0; margin-top: 86px; background: #fff; border: 3px solid var(--ink); border-radius: 24px; padding: 14px 18px 14px; box-shadow: 0 6px 0 var(--ink); }
.balon::before { content: ""; position: absolute; left: -16px; top: 18px; border: 10px solid transparent; border-right: 14px solid var(--ink); }
.balon::after { content: ""; position: absolute; left: -10px; top: 21px; border: 7px solid transparent; border-right: 11px solid #fff; }
.balon-isim { display: inline-block; font-family: var(--font-d); font-weight: 800; font-size: .95rem; background: var(--blue); color: #fff; padding: 1px 12px; border-radius: 999px; margin-bottom: 6px; }
.balon-metin { font-size: 1.14rem; font-weight: 500; min-height: 3.2em; cursor: pointer; }
.balon-alt { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin-top: 10px; }
.noktalar { display: flex; gap: 6px; }
.noktalar i { width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
.noktalar i.on { background: var(--blue); }
.balon-dugmeler { display: flex; gap: 8px; margin-left: auto; }
@media (max-width: 640px) { .karakter { width: 84px; } .anlatici { margin-top: -54px; padding-left: 4px; } .balon { margin-top: 60px; padding: 12px 14px; } .balon-metin { font-size: 1.04rem; } }

/* Görev alanı */
.gorev { margin-top: 26px; display: flex; flex-direction: column; gap: 20px; }
.istasyon { display: flex; align-items: center; gap: 10px; font-family: var(--font-d); font-weight: 800; font-size: 1.45rem; }
.istasyon-ikon { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--purple); box-shadow: 0 4px 0 var(--purple-d); flex: none; }
.veri-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 16px; }
.pop { animation: pop .5s cubic-bezier(.3,1.5,.5,1) both; }
@keyframes pop { from { opacity: 0; transform: translateY(18px) scale(.95); } }
.gorsel { background: var(--panel); border: 3px solid var(--line); border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; box-shadow: 0 5px 0 var(--line); }
.gorsel.genis { grid-column: 1 / -1; }
.gorsel-baslik { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.gorsel-baslik h3 { font-size: 1.2rem; }
.temsili { font-size: .7rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); background: #eef4fa; border-radius: 999px; padding: 3px 10px; }
.gorsel svg { width: 100%; height: auto; display: block; }
.grafik-kap { overflow-x: auto; }
.not { font-size: .82rem; color: var(--muted); }
.svg-metin { fill: var(--muted); font-family: var(--font-b); font-size: 13px; }
.svg-deger { fill: var(--ink); font-family: var(--font-d); font-size: 16px; font-weight: 800; }
.buyu { transform-box: fill-box; transform-origin: 50% 100%; animation: buyu .8s cubic-bezier(.3,1.4,.5,1) both; }
@keyframes buyu { from { transform: scaleY(0); } }
.ciz { stroke-dasharray: 1; stroke-dashoffset: 1; animation: ciz 1.4s ease forwards .2s; }
@keyframes ciz { to { stroke-dashoffset: 0; } }
.lejant { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .82rem; color: var(--muted); }
.lejant i { display: inline-block; width: 14px; height: 14px; border-radius: 4px; vertical-align: -2px; margin-right: 6px; }
.alarm { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px; align-items: center; border-radius: 22px; padding: 16px; border: 3px solid var(--red); background: #ffe9e4; box-shadow: 0 5px 0 var(--red-d); }
.alarm.turuncu { border-color: var(--orange); background: #fff2dc; box-shadow: 0 5px 0 var(--orange-d); }
.alarm-ikon { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; background: var(--red); color: #fff; font-family: var(--font-d); font-weight: 800; font-size: 2rem; animation: alarm 1s ease-in-out infinite; }
.alarm.turuncu .alarm-ikon { background: var(--orange); }
@keyframes alarm { 0%, 100% { box-shadow: 0 0 0 0 rgba(236,79,76,.5); } 50% { box-shadow: 0 0 0 12px rgba(236,79,76,0); } }
.alarm h3 { font-size: 1.2rem; }
.alarm .kaynak { font-size: .74rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.bilgi-kartlar { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 10px; }
.bilgi-kart { border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; min-width: 0; background: #f2f8fd; border: 2px solid var(--line); }
.bilgi-kart b { font-family: var(--font-d); font-size: 1.12rem; display: flex; align-items: center; gap: 8px; }
.bilgi-kart b::before { content: ""; width: 12px; height: 12px; border-radius: 4px; background: var(--k, var(--blue)); flex: none; }
.bilgi-kart span { font-size: .92rem; }
.harita-bilgi { background: #f2f8fd; border-radius: 16px; padding: 12px 14px; min-height: 84px; font-size: .95rem; border: 2px dashed var(--line); }
.harita-bilgi b { font-family: var(--font-d); font-size: 1.15rem; display: block; }
.ipucu { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: .9rem; }
.ipucu-cubuk { flex: 1; height: 10px; border-radius: 5px; background: #e6eef6; overflow: hidden; }
.ipucu-cubuk i { display: block; height: 100%; background: var(--purple); border-radius: 5px; transition: width .4s; }
.nokta { cursor: pointer; }
.nokta .govde { transition: transform .15s; transform-box: fill-box; transform-origin: center; }
.nokta:hover .govde, .nokta.secili .govde { transform: scale(1.18); }
.nokta:focus { outline: none; }
.nokta:focus-visible .govde { stroke: var(--yellow); stroke-width: 5; }
.nabiz { transform-box: fill-box; transform-origin: center; animation: nabiz 1.8s ease-out infinite; }
@keyframes nabiz { from { transform: scale(1); opacity: .6; } to { transform: scale(2.1); opacity: 0; } }
.nokta.goruldu .nabiz { display: none; }

/* Karar alanı */
.karar-kutu { background: var(--ink); color: #fff; border-radius: 26px; padding: 22px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 7px 0 #0e1830; }
.karar-ust { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.karar-etiket { font-family: var(--font-d); font-weight: 800; font-size: 1rem; background: var(--yellow); color: var(--ink); padding: 3px 14px; border-radius: 999px; }
.karar-soru { font-family: var(--font-d); font-weight: 700; font-size: clamp(1.35rem, 3vw, 1.75rem); line-height: 1.2; }
.secimler { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 16px; }
.secim { --c: var(--blue); --cd: var(--blue-d); position: relative; display: flex; flex-direction: column; gap: 12px; text-align: left; border: 0; border-radius: 22px; padding: 18px; background: var(--c); color: #fff; cursor: pointer; box-shadow: 0 7px 0 var(--cd); transition: transform .15s, box-shadow .15s, opacity .3s, filter .3s; font-size: 1.05rem; font-weight: 500; line-height: 1.4; }
.secim:nth-child(2) { --c: var(--purple); --cd: var(--purple-d); }
.secim:nth-child(3) { --c: var(--orange); --cd: var(--orange-d); }
.secim:hover:not([disabled]) { transform: translateY(-5px) rotate(-1deg); box-shadow: 0 12px 0 var(--cd); }
.secim:active:not([disabled]) { transform: translateY(4px); box-shadow: 0 2px 0 var(--cd); }
.secim .harf { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; background: rgba(255,255,255,.95); color: var(--cd); font-family: var(--font-d); font-weight: 800; font-size: 1.6rem; }
.secim[disabled] { cursor: default; }
.secim[disabled]:not(.secili) { opacity: .35; filter: grayscale(.7); transform: scale(.96); }
.secim.secili { box-shadow: 0 7px 0 var(--cd), 0 0 0 5px var(--yellow); animation: sec .5s cubic-bezier(.3,1.6,.5,1); }
.secim.secili::after { content: "SEÇİMİN"; position: absolute; top: -12px; right: 14px; font-family: var(--font-d); font-weight: 800; font-size: .85rem; background: var(--yellow); color: var(--ink); padding: 2px 10px; border-radius: 999px; }
@keyframes sec { 0% { transform: scale(1); } 40% { transform: scale(1.06); } 100% { transform: scale(1); } }
.sonuc-kart { background: #fff; color: var(--ink); border-radius: 24px; padding: 18px; display: grid; grid-template-columns: 90px minmax(0, 1fr); gap: 16px; align-items: start; border: 4px solid var(--line); }
.sonuc-kart.guclu { border-color: var(--green); } .sonuc-kart.kismi { border-color: var(--orange); } .sonuc-kart.riskli { border-color: var(--red); }
.sonuc-kart:focus { outline: none; }
.sonuc-icerik { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.sonuc-icerik h3 { font-size: 1.5rem; }
@media (max-width: 560px) { .sonuc-kart { grid-template-columns: 1fr; } .sonuc-kart .karakter { width: 70px; } }
.chip { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-d); font-weight: 800; font-size: .95rem; border-radius: 999px; padding: 2px 12px; align-self: flex-start; color: #fff; }
.chip.guclu { background: var(--green); } .chip.kismi { background: var(--orange-d); } .chip.riskli { background: var(--red); }
.etkiler { display: flex; flex-wrap: wrap; gap: 8px; }
.etki { font-family: var(--font-d); font-weight: 800; font-size: 1rem; border-radius: 12px; padding: 3px 12px; font-variant-numeric: tabular-nums; animation: pop .5s cubic-bezier(.3,1.5,.5,1) both; }
.etki.art { background: #ddf5e8; color: var(--green-d); } .etki.azal { background: #ffe3e2; color: var(--red-d); }
.eylemler { display: flex; flex-wrap: wrap; gap: 10px; }

/* Giriş ekranı */
.giris-anlatici .balon-metin { min-height: 2.4em; }
.bolum-baslik { font-family: var(--font-d); font-size: 1.8rem; font-weight: 800; margin: 34px 0 14px; }
.bolumler { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 16px; }
@media (max-width: 760px) { .bolumler { grid-template-columns: 1fr; } }
.bolum { background: #fff; border-radius: 26px; border: 4px solid var(--blue); box-shadow: 0 7px 0 var(--blue-d); overflow: hidden; display: flex; flex-direction: column; }
.bolum .sahne-kutu { border: 0; border-radius: 0; box-shadow: none; aspect-ratio: 1000 / 360; }
.bolum-govde { padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.bolum-govde h3 { font-size: 1.7rem; }

/* ---------- Ses efektleri (Web Audio, varsayılan kapalı) ---------- */
function sesCal(tur) {
  if (!ses) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const notalar = { tik: [660], iyi: [523, 659, 784, 1046], orta: [523, 587], kotu: [392, 311, 247], rozet: [784, 988, 1175, 1568], adim: [587, 880] }[tur] || [600];
    notalar.forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + i * 0.09;
      o.type = tur === "kotu" ? "triangle" : "sine"; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.18, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t + 0.25);
    });
  } catch (e) {}
}

function baslat() { S = yeniDurum(); S.ekran = "oyun"; sesCal("adim"); git(SENARYO.baslangic); }

function sec(i) {
  const d = dugum(); if (S.secim !== null) return;
  const s = d.secenekler[i];

  S.gecmis.push({ dugum: S.dugum, metre: once, secim: i });
  Object.entries(s.etki || {}).forEach(([k, v]) => S.metre[k] = sinirla(S.metre[k] + v));
  S.secim = i;
  sesCal(s.tip === "guclu" ? "iyi" : s.tip === "kismi" ? "orta" : "kotu");
  document.querySelectorAll(".secim").forEach((b, j) => { b.disabled = true; b.classList.toggle("secili", j === i); });
  metreleriGuncelle(once);

  balonGuncelle();
  const alan = document.getElementById("sonuc-alani");

  if (s.tip === "guclu") konfeti(40);
}
function devam() {

  else { S.gecmis.push({ dugum: S.dugum, metre: { ...S.metre }, secim: null }); git(d.sonraki); }

}
function oncekiKarar() {

  while (S.gecmis.length) { const x = S.gecmis.pop(); if (x.secim !== null) { e = x; break; } }

}
function kararaDon(index) {

}

  agac: c => `<rect x="18" y="24" width="4.5" height="10" rx="2" fill="#8d5a2b"/><circle cx="20" cy="15" r="10" fill="${c}"/><circle cx="13" cy="20" r="6" fill="${c}"/><circle cx="27" cy="20" r="6" fill="${c}"/><circle cx="16" cy="11" r="2.6" fill="#fff" opacity=".45"/>`,

  kupa: () => `<path d="M13 8h14v8a7 7 0 0 1-14 0z" fill="currentColor"/><path d="M13 11H8a5 5 0 0 0 5 6M27 11h5a5 5 0 0 1-5 6" stroke="currentColor" stroke-width="2.6" fill="none"/><rect x="17.5" y="22" width="5" height="6" fill="currentColor"/><rect x="13" y="28" width="14" height="4" rx="2" fill="currentColor"/>`
};
const ikon = (ad, c, boyut = 24) => `<svg width="${boyut}" height="${boyut}" viewBox="0 0 40 40" aria-hidden="true">${IKON[ad](c)}</svg>`;

}

/* ---------- Animasyonlu şehir sahnesi ---------- */
function sahne(c = {}) {
  const gok = c.gok || "acik", yagis = c.yagis || 0, taskin = c.taskin || 0, id = "s" + (++sahneNo);
  const GOK = { acik: ["#5ec0ff", "#d9f2ff"], bulutlu: ["#8db4d3", "#dde9f2"], firtina: ["#46597a", "#93a6bb"] }[gok];
  const firtina = gok === "firtina";
  const tepe = firtina ? "#6aa36a" : "#8fd38a", zemin = firtina ? "#5c9a57" : "#79c470", deniz = firtina ? "#3a86b8" : "#3fa6e6";
  let s = `<svg class="sahne-svg" viewBox="0 0 1000 420" preserveAspectRatio="xMidYMid slice" role="img" aria-label="${c.etiket || "Şehir sahnesi"}">
  <defs>
    <linearGradient id="${id}g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${GOK[0]}"/><stop offset="1" stop-color="${GOK[1]}"/></linearGradient>
    <linearGradient id="${id}s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5cb9f0"/><stop offset="1" stop-color="#1d6db5"/></linearGradient>
  </defs>
  <rect width="1000" height="420" fill="url(#${id}g)"/>`;
  if (gok === "acik") s += `<g transform="translate(870 80)"><g class="gunes-isin">${Array.from({ length: 10 }, (_, i) => `<rect x="-4" y="-66" width="8" height="20" rx="4" fill="#ffd23f" transform="rotate(${i * 36})"/>`).join("")}</g><circle r="38" fill="#ffd23f" stroke="#ffb703" stroke-width="5"/></g>`;
  if (c.gokkusagi) s += `<g class="belir" fill="none" stroke-width="13" opacity=".55">${["#ef5350", "#ff9a1f", "#ffd23f", "#4caf50", "#2196f3", "#7c55c7"].map((r, i) => `<path d="M${180 + i * 13} 300 A${320 - i * 13} ${250 - i * 13} 0 0 1 ${820 - i * 13} 300" stroke="${r}"/>`).join("")}</g>`;
  // Bulutlar
  const bulutSay = gok === "acik" ? 3 : 6, bulutRenk = firtina ? "#6c7d93" : gok === "bulutlu" ? "#eef3f8" : "#ffffff";
  for (let i = 0; i < bulutSay; i++) {
    const y = rnd(20, firtina ? 110 : 130), sc = rnd(.8, 1.5), sure = rnd(45, 80);
    s += `<g transform="translate(0 ${y})"><g class="bulut" style="animation-duration:${sure}s;animation-delay:-${rnd(0, sure)}s"><g transform="scale(${sc})" fill="${bulutRenk}">
      <ellipse cx="60" cy="30" rx="58" ry="20"/><circle cx="40" cy="22" r="20"/><circle cx="72" cy="14" r="26"/><circle cx="96" cy="26" r="16"/></g></g></g>`;
  }
  // Uzak şehir silueti
  const sil = firtina ? "#7d91aa" : "#a8c6de";
  s += `<g fill="${sil}">
    <rect x="30" y="200" width="40" height="60"/><rect x="80" y="180" width="30" height="80"/><rect x="118" y="210" width="44" height="50"/>
    <rect x="248" y="170" width="7" height="90"/><path d="M245 172 251 148 258 172z"/><rect x="345" y="170" width="7" height="90"/><path d="M342 172 348 148 355 172z"/>
    <path d="M262 260 V228 A38 30 0 0 1 338 228 V260z"/><path d="M290 200 A10 9 0 0 1 310 200z"/>
    <rect x="410" y="200" width="36" height="60"/><rect x="455" y="186" width="26" height="74"/>
    <rect x="525" y="190" width="30" height="70"/><path d="M520 192 540 150 560 192z"/>
    <rect x="590" y="206" width="50" height="54"/><rect x="650" y="190" width="28" height="70"/><rect x="690" y="214" width="40" height="46"/>
  </g>`;
  s += `<path d="M0 262 C160 228 300 258 460 240 S760 222 1000 250 L1000 420 L0 420Z" fill="${tepe}"/>`;
  s += `<path d="M0 300 C220 286 420 304 620 296 S860 288 1000 300 L1000 420 L0 420Z" fill="${zemin}"/>`;
  s += `<path d="M800 420 C830 368 880 336 1000 324 L1000 420Z" fill="${deniz}"/>
    <path class="dalga" d="M820 370 q20 -8 40 0 t40 0 t40 0 t40 0 t40 0 t40 0" stroke="#fff" stroke-width="3" fill="none" opacity=".6"/>`;
  // Dere
  s += `<path d="M90 268 C230 300 360 300 480 318 S690 336 830 380" stroke="${deniz}" stroke-width="18" fill="none" stroke-linecap="round"/>
    <path class="parilti" d="M90 268 C230 300 360 300 480 318 S690 336 830 380" stroke="#e6f6ff" stroke-width="3" fill="none" stroke-linecap="round" opacity=".7"/>`;
  // Ağaçlar
  [[40, 296], [228, 300], [452, 302], [560, 306], [905, 296]].forEach(([x, y], i) => {
    s += `<g class="sallan" style="animation-delay:-${i * .6}s"><rect x="${x - 3}" y="${y - 6}" width="6" height="16" rx="2" fill="#8d5a2b"/><circle cx="${x}" cy="${y - 18}" r="16" fill="${i % 2 ? "#3fa34d" : "#2e8b57"}"/><circle cx="${x - 5}" cy="${y - 23}" r="4" fill="#fff" opacity=".25"/></g>`;
  });
  // Evler
  const ev = (x, y, w, h, renk, cati) => `<g><rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${renk}" stroke="#1b2a4a" stroke-width="2.5"/>
    <path d="M${x - 5} ${y + 2} L${x + w / 2} ${y - h * .55} L${x + w + 5} ${y + 2}Z" fill="${cati}" stroke="#1b2a4a" stroke-width="2.5" stroke-linejoin="round"/>
    <rect x="${x + w * .18}" y="${y + h * .25}" width="${w * .24}" height="${h * .24}" fill="#fff6c2" stroke="#1b2a4a" stroke-width="1.6"/>
    <rect x="${x + w * .58}" y="${y + h * .45}" width="${w * .24}" height="${h * .55}" fill="#8d5a2b" stroke="#1b2a4a" stroke-width="1.6"/></g>`;
  s += ev(60, 236, 44, 36, "#fff59d", "#e65100") + ev(128, 248, 40, 32, "#a5d6a7", "#2e7d32") + ev(190, 240, 48, 38, "#ffab91", "#bf360c");
  // Okul
  s += `<g><rect x="330" y="268" width="96" height="50" fill="#ffe082" stroke="#1b2a4a" stroke-width="2.5"/><path d="M322 270 L378 238 L434 270Z" fill="#c0392b" stroke="#1b2a4a" stroke-width="2.5" stroke-linejoin="round"/>
    ${[342, 366, 398].map(x => `<rect x="${x}" y="280" width="14" height="12" fill="#bfe6ff" stroke="#1b2a4a" stroke-width="1.6"/>`).join("")}
    <rect x="370" y="298" width="16" height="20" fill="#8d5a2b" stroke="#1b2a4a" stroke-width="1.6"/>
    <text x="378" y="262" text-anchor="middle" style="font:800 11px var(--font-d)" fill="#fff">OKUL</text>
    <rect x="436" y="226" width="3" height="92" fill="#1b2a4a"/><path class="bayrak" d="M439 228 h30 l-6 9 6 9 h-30z" fill="#e30a17"/>
    <circle cx="452" cy="237" r="4" fill="#fff"/><circle cx="453.5" cy="237" r="3.2" fill="#e30a17"/></g>`;
  s += ev(594, 300, 40, 34, "#ce93d8", "#6a1b9a") + ev(648, 296, 46, 40, "#ff8a65", "#c0392b") + ev(708, 304, 40, 34, "#ffd54f", "#e67e22") + ev(760, 314, 42, 34, "#81d4fa", "#1565c0");
  // Yol ve alt geçit
  s += `<path d="M-10 362 L520 362 Q600 398 680 362 L1010 362" stroke="#5d6b80" stroke-width="30" fill="none"/>
    <path d="M-10 362 L520 362 Q600 398 680 362 L1010 362" stroke="#fff" stroke-width="3" stroke-dasharray="18 14" fill="none"/>
    <g transform="translate(508 318)"><rect x="-2" y="0" width="4" height="30" fill="#1b2a4a"/><path d="M0 -14 14 8 H-14Z" fill="#ffd23f" stroke="#1b2a4a" stroke-width="2.5" stroke-linejoin="round"/><text x="0" y="5" text-anchor="middle" style="font:800 12px var(--font-d)" fill="#1b2a4a">!</text></g>`;
  // Araba
  const araba = `<rect x="0" y="0" width="52" height="16" rx="6" fill="#ec4f4c" stroke="#1b2a4a" stroke-width="2.5"/><path d="M10 0 L16 -11 H36 L44 0Z" fill="#ec4f4c" stroke="#1b2a4a" stroke-width="2.5"/><rect x="18" y="-8" width="9" height="7" fill="#bfe6ff"/><rect x="29" y="-8" width="9" height="7" fill="#bfe6ff"/><circle cx="13" cy="17" r="6" fill="#1b2a4a"/><circle cx="40" cy="17" r="6" fill="#1b2a4a"/>`;
  if (taskin < 2) s += `<g transform="translate(0 338)"><g class="araba-git">${araba}</g></g>`;
  else s += `<g transform="translate(574 352) rotate(-6)">${araba}</g>`;
  // Su baskını
  if (taskin === 1) s += `<g class="yuksel" fill="#4aa8e8" opacity=".85"><ellipse cx="600" cy="384" rx="62" ry="9"/><ellipse cx="700" cy="346" rx="46" ry="6"/><ellipse cx="380" cy="324" rx="38" ry="5"/></g>`;
  if (taskin >= 2) {
    const ust = taskin === 2 ? 352 : 318, bas = taskin === 2 ? 420 : 180;
    let dalga = `M${bas} 430 L${bas} ${ust}`;
    for (let x = bas; x < 1100; x += 40) dalga += ` q10 -7 20 0 t20 0`;
    dalga += ` L1100 430Z`;
    s += `<g class="yuksel"><g class="dalga"><path d="${dalga}" fill="url(#${id}s)" opacity=".86"/><path d="M${bas} ${ust} ${Array.from({ length: Math.ceil((1100 - bas) / 40) }, () => "q10 -7 20 0 t20 0").join(" ")}" stroke="#e6f6ff" stroke-width="3" fill="none"/></g></g>`;
  }
  // Yağmur
  const damlaSay = [0, 45, 90, 150][yagis];
  if (damlaSay) {
    s += `<g stroke="#eaf7ff" stroke-width="2.2" stroke-linecap="round" opacity="${firtina ? .85 : .75}">`;
    for (let i = 0; i < damlaSay; i++) {
      const x = rnd(-20, 1020), sure = rnd(.55, .9);
      s += `<line class="damla-yagmur" x1="${x}" y1="0" x2="${x - 6}" y2="${rnd(14, 22)}" style="animation-duration:${sure}s;animation-delay:-${rnd(0, sure)}s"/>`;
    }
    s += `</g>`;
  }
  if (firtina) s += `<rect class="simsek" width="1000" height="420" fill="#fff"/><path class="simsek" d="M230 20 L205 80 H226 L200 140 L262 62 H238 L258 20Z" fill="#fff6a8" stroke="#ffd23f" stroke-width="2"/>`;
  return s + `</svg>`;
}

/* ---------- Üst çubuk ---------- */
function hud() {
  const oyunda = S.ekran === "oyun";
  const d = oyunda ? dugum() : null;
  return `<header class="hud">
    <div class="hud-marka">${logo(34)}<span>İklim Rotası</span></div>
    ${d ? rota(d.adim) : ""}
    ${d ? metreler() : ""}
    <div class="hud-dugmeler">
      <button class="btn beyaz kucuk ikon" data-eylem="ses" aria-pressed="${ses}" aria-label="${ses ? "Sesi kapat" : "Sesi aç"}" title="${ses ? "Ses açık" : "Ses kapalı"}">${ikon(ses ? "sesAcik" : "sesKapali", "", 24)}</button>
      ${oyunda ? `<button class="btn beyaz kucuk ikon" data-eylem="geri" ${geriVar() ? "" : "disabled"} aria-label="Önceki karara dön" title="Önceki karara dön">${ikon("geri", "", 24)}</button>
      <button class="btn beyaz kucuk ikon" data-eylem="yenidenSor" aria-label="Yeniden başlat" title="Yeniden başlat">${ikon("yenile", "", 24)}</button>` : ""}
    </div>
  </header>
  ${S.onay ? `<div class="onay" role="alert"><p>Oyun baştan başlasın mı? Bu yoldaki bütün kararlar silinir.</p>
    <button class="btn turuncu kucuk" data-eylem="baslat">Evet, baştan başlat</button>
    <button class="btn beyaz kucuk" data-eylem="vazgec">Vazgeç</button>
    <button class="btn beyaz kucuk" data-eylem="anaEkran">Ana ekran</button></div>` : ""}`;
}
function logo(b) {
  return `<svg width="${b}" height="${b}" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="12" fill="#1e88e5"/><path d="M20 7c-5 7-8 10-8 14a8 8 0 0 0 16 0c0-4-3-7-8-14z" fill="#fff"/><path d="M8 31c4-2 7-2 12 0s8 2 12 0" stroke="#ffd23f" stroke-width="3" fill="none" stroke-linecap="round"/></svg>`;
}
function rota(adim) {
  let s = "";
  for (let i = 1; i <= SENARYO.toplamAdim; i++) {
    if (i > 1) s += `<span class="rota-cizgi ${i <= adim ? "tamam" : ""}"></span>`;
    const ic = i === SENARYO.toplamAdim ? ikon("kupa", "", 16) : i < adim ? "✓" : i;
    s += `<span class="rota-nokta ${i < adim ? "tamam" : i === adim ? "simdi" : ""}">${ic}</span>`;
  }
  return `<div class="rota" aria-label="Aşama ${adim} / ${SENARYO.toplamAdim}">${s}</div>`;
}
const metreRengi = v => v >= 65 ? "#22a866" : v >= 40 ? "#ff9a1f" : "#ec4f4c";
function metreler() {
  return `<div class="metreler">${SENARYO.gostergeler.map(g => {
    const v = S.metre[g.id], [ik, rk] = METRE_IKON[g.id] || ["kalkan", "#1e88e5"];
    return `<div class="metre" id="metre-${g.id}"><span class="metre-ikon">${ikon(ik, rk, 30)}</span>
      <div class="metre-govde"><div class="metre-ust"><span>${g.ad}</span><b>${v}</b></div>
      <div class="metre-cubuk" role="meter" aria-label="${g.ad}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${v}"><div class="metre-dolu" style="width:${v}%;background:${metreRengi(v)}"></div></div></div></div>`;
  }).join("")}</div>`;
}
function metreleriGuncelle(once) {
  SENARYO.gostergeler.forEach(g => {
    const el = document.getElementById("metre-" + g.id); if (!el) return;
    const v = S.metre[g.id], fark = v - once[g.id];
    el.querySelector("b").textContent = v;
    const d = el.querySelector(".metre-dolu"); d.style.width = v + "%"; d.style.background = metreRengi(v);
    el.querySelector(".metre-cubuk").setAttribute("aria-valuenow", v);
    if (fark) {
      const u = document.createElement("span"); u.className = "ucan";
      u.style.color = fark > 0 ? "#16794a" : "#b02a28"; u.textContent = (fark > 0 ? "+" : "−") + Math.abs(fark);
      el.appendChild(u); setTimeout(() => u.remove(), 1500);
    }
  });
}

/* ---------- Ekranlar ---------- */
function ciz() {
  clearInterval(yazZaman);
  if (S.ekran === "giris") return cizGiris();
  if (dugum().tur === "son") return cizSon();

/* ---------- Görseller ---------- */
function gorsel(g, sira) {
  const gecikme = `style="animation-delay:${.08 + sira * .12}s"`;
  if (g.tur === "uyari") return `<div class="alarm pop ${g.seviye === "turuncu" ? "turuncu" : ""}" ${gecikme}><div class="alarm-ikon" aria-hidden="true">!</div>
    <div><div class="kaynak">${g.kaynak}</div><h3>${g.baslik}</h3><p style="margin-top:4px">${g.metin}</p></div></div>`;
  const ust = `<div class="gorsel-baslik"><h3>${g.baslik}</h3>${g.temsili || g.tur === "harita" ? `<span class="temsili">Temsili</span>` : ""}</div>`;
  if (g.tur === "kartlar") {
    const renk = ["#1e88e5", "#7c55c7", "#ff9a1f", "#22a866", "#ec4f4c", "#ffd23f"];
    return `<div class="gorsel pop ${g.genis ? "genis" : ""}" ${gecikme}>${ust}<div class="bilgi-kartlar">${g.kartlar.map((k, i) => `<div class="bilgi-kart" style="--k:${renk[i % renk.length]}"><b>${k.baslik}</b><span>${k.metin}</span></div>`).join("")}</div></div>`;
  }
  if (g.tur === "cubuk") return `<div class="gorsel pop" ${gecikme}>${ust}<div class="grafik-kap">${cubukGrafik(g)}</div>
    ${g.esik ? `<div class="lejant"><span><i style="background:#1e88e5"></i>Sınırın altında</span><span><i style="background:#ec4f4c"></i>Sınırın üstünde</span><span><i style="background:transparent;border:2px dashed #ec4f4c"></i>${g.esik.etiket}</span></div>` : ""}
    ${g.not ? `<p class="not">${g.not}</p>` : ""}</div>`;
  if (g.tur === "cizgi") return `<div class="gorsel pop" ${gecikme}>${ust}<div class="grafik-kap">${cizgiGrafik(g)}</div>
    <div class="lejant">${g.seriler.map((s, i) => `<span><i style="${i ? "background:transparent;border:2px dashed #ec4f4c" : "background:#1e88e5"}"></i>${s.ad}</span>`).join("")}</div>
    ${g.not ? `<p class="not">${g.not}</p>` : ""}</div>`;
  if (g.tur === "harita") return `<div class="gorsel pop" ${gecikme}>${ust}${harita(g)}
    <div class="ipucu"><span>İpucu</span><span class="ipucu-cubuk"><i style="width:${incelenen.size / HARITA_NOKTALARI.length * 100}%"></i></span><span class="ipucu-sayi">${incelenen.size}/${HARITA_NOKTALARI.length}</span></div>
    <div class="harita-bilgi" aria-live="polite"><b>Numaralara dokun!</b><span class="muted">Her nokta bir ipucu. Hepsini bulursan rozet kazanırsın.</span></div>
    <div class="lejant"><span><i style="background:#ec4f4c;opacity:.55"></i>Yüksek risk alanı</span><span><i style="background:#ff9a1f;opacity:.4"></i>Orta risk alanı</span>${g.taskin ? `<span><i style="background:#2f8fd8;opacity:.7"></i>Su basan alan</span>` : ""}</div></div>`;
  return "";
}
const guzelUst = v => [10, 20, 40, 60, 80, 100, 120, 160, 200].find(s => s >= v * 1.08) || Math.ceil(v / 40) * 40;

function cubukGrafik(g) {
  const W = 560, H = 260, ml = 42, mr = 10, mt = 26, mb = g.xBaslik ? 52 : 34;
  const maks = guzelUst(Math.max(...g.degerler, g.esik ? g.esik.deger : 0));
  const iw = W - ml - mr, ih = H - mt - mb, n = g.degerler.length, adim = iw / n, bw = Math.min(64, adim * .66);
  const y = v => mt + ih - v / maks * ih, yuzde = g.birim === "%" ? "%" : "";
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${g.baslik}">`;
  for (let i = 0; i <= 4; i++) {
    const v = maks / 4 * i;
    s += `<line x1="${ml}" x2="${W - mr}" y1="${y(v)}" y2="${y(v)}" stroke="#e3ecf5" stroke-width="1.5"/><text class="svg-metin" x="${ml - 8}" y="${y(v) + 4}" text-anchor="end">${v}${yuzde}</text>`;
  }
  g.degerler.forEach((v, i) => {
    const x = ml + adim * i + (adim - bw) / 2, asti = g.esik && v > g.esik.deger, gec = .15 + i * .08;
    const renk = asti ? "#ec4f4c" : "#1e88e5", koyu = asti ? "#b02a28" : "#1262b3";
    s += `<g class="buyu" style="animation-delay:${gec}s"><rect x="${x}" y="${y(v) + 4}" width="${bw}" height="${Math.max(0, mt + ih - y(v) - 4)}" rx="8" fill="${koyu}"/><rect x="${x}" y="${y(v)}" width="${bw}" height="${Math.max(0, mt + ih - y(v) - 4)}" rx="8" fill="${renk}"/><rect x="${x + 6}" y="${y(v) + 6}" width="${bw * .22}" height="${Math.max(0, (mt + ih - y(v)) * .5)}" rx="4" fill="#fff" opacity=".22"/></g>`;
    s += `<text class="svg-deger belir" style="animation-delay:${gec + .5}s" x="${x + bw / 2}" y="${y(v) - 7}" text-anchor="middle">${v}${yuzde}</text>`;
    s += `<text class="svg-metin" x="${x + bw / 2}" y="${mt + ih + 20}" text-anchor="middle">${g.etiketler[i]}</text>`;
  });
  if (g.esik) s += `<line x1="${ml}" x2="${W - mr}" y1="${y(g.esik.deger)}" y2="${y(g.esik.deger)}" stroke="#ec4f4c" stroke-width="2.5" stroke-dasharray="8 6"/>`;
  if (!yuzde) s += `<text class="svg-metin" x="${ml - 8}" y="${mt - 10}" text-anchor="end">${g.birim}</text>`;
  if (g.xBaslik) s += `<text class="svg-metin" x="${ml + iw / 2}" y="${H - 6}" text-anchor="middle">${g.xBaslik}</text>`;
  return s + `</svg>`;
}

function cizgiGrafik(g) {
  const W = 560, H = 250, ml = 42, mr = 20, mt = 26, mb = 34;
  const maks = guzelUst(Math.max(...g.seriler.flatMap(s => s.degerler).filter(v => v !== null)));
  const iw = W - ml - mr, ih = H - mt - mb, n = g.etiketler.length;
  const x = i => ml + iw / (n - 1) * i, y = v => mt + ih - v / maks * ih;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${g.baslik}">`;
  for (let i = 0; i <= 4; i++) { const v = maks / 4 * i; s += `<line x1="${ml}" x2="${W - mr}" y1="${y(v)}" y2="${y(v)}" stroke="#e3ecf5" stroke-width="1.5"/><text class="svg-metin" x="${ml - 8}" y="${y(v) + 4}" text-anchor="end">${v}</text>`; }
  g.etiketler.forEach((e, i) => s += `<text class="svg-metin" x="${x(i)}" y="${mt + ih + 20}" text-anchor="middle">${e}</text>`);
  g.seriler.forEach((ser, si) => {
    const renk = si ? "#ec4f4c" : "#1e88e5";
    const pts = ser.degerler.map((v, i) => v === null ? null : [x(i), y(v)]).filter(Boolean);
    if (!si) s += `<polygon class="belir" points="${pts[0][0]},${mt + ih} ${pts.map(p => p.join(",")).join(" ")} ${pts[pts.length - 1][0]},${mt + ih}" fill="#1e88e5" opacity=".12"/>`;
    s += ser.kesikli
      ? `<polyline class="belir" style="animation-delay:1.2s" points="${pts.map(p => p.join(",")).join(" ")}" fill="none" stroke="${renk}" stroke-width="4" stroke-dasharray="9 7" stroke-linecap="round" stroke-linejoin="round"/>`
      : `<polyline class="ciz" pathLength="1" points="${pts.map(p => p.join(",")).join(" ")}" fill="none" stroke="${renk}" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>`;
    ser.degerler.forEach((v, i) => { if (v !== null) s += `<circle class="belir" style="animation-delay:${si ? 1.3 : .3 + i * .15}s" cx="${x(i)}" cy="${y(v)}" r="5.5" fill="#fff" stroke="${renk}" stroke-width="3"/>`; });
    const son = ser.degerler.map((v, i) => [v, i]).filter(p => p[0] !== null).pop();
    s += `<text class="svg-deger belir" style="animation-delay:1.5s" x="${x(son[1])}" y="${y(son[0]) - 12}" text-anchor="${son[1] === n - 1 ? "end" : "middle"}">${son[0]} ${g.birim}</text>`;
  });
  return s + `</svg>`;
}

function harita(g) {
  const dere = "M30,60 C120,90 150,170 230,200 S360,250 470,330", asagi = "M205,188 C280,212 380,250 470,330", t = g.taskin || 0;
  let su = "";
  if (t >= 1) su += `<path class="belir" d="M330,244 C390,265 430,290 470,330" stroke="#2f8fd8" stroke-width="34" stroke-linecap="round" fill="none" opacity=".6"/>`;
  if (t >= 2) su += `<path class="belir" d="${asagi}" stroke="#2f8fd8" stroke-width="64" stroke-linecap="round" fill="none" opacity=".5"/>`;
  if (t >= 3) su += `<path class="belir" d="${dere}" stroke="#2f8fd8" stroke-width="96" stroke-linecap="round" fill="none" opacity=".38"/><path class="belir" d="M300,250 C380,280 430,310 465,340" stroke="#2f8fd8" stroke-width="120" stroke-linecap="round" fill="none" opacity=".42"/>`;
  const binalar = [[405, 280, "#ff8a65"], [420, 312, "#ffd54f"], [452, 268, "#81d4fa"], [395, 305, "#ce93d8"], [180, 252, "#ffe082"], [215, 252, "#ffe082"], [95, 312, "#a5d6a7"], [118, 332, "#fff"], [410, 88, "#fff59d"], [440, 92, "#ffab91"], [425, 124, "#a5d6a7"], [300, 205, "#ffd54f"], [275, 288, "#81d4fa"]]
    .map(([x, y, r]) => `<rect x="${x - 8}" y="${y - 7}" width="16" height="14" rx="3" fill="${r}" stroke="#1b2a4a" stroke-width="1.5"/>`).join("");
  const noktalar = HARITA_NOKTALARI.map((p, i) => `
    <g class="nokta ${incelenen.has(i) ? "goruldu" : ""}" data-eylem="nokta" data-i="${i}" tabindex="0" role="button" aria-label="${i + 1}. ${p.ad}, ${RISK_ADI[p.risk]}">
      <circle class="nabiz" cx="${p.x}" cy="${p.y}" r="16" fill="${RISK_RENK[p.risk]}"/>
      <circle class="govde" cx="${p.x}" cy="${p.y}" r="17" fill="${RISK_RENK[p.risk]}" stroke="#fff" stroke-width="4"/>
      <text x="${p.x}" y="${p.y + 6}" text-anchor="middle" fill="#fff" style="font:800 17px var(--font-d);pointer-events:none">${incelenen.has(i) ? "✓" : i + 1}</text>
    </g>`).join("");
  return `<div class="grafik-kap"><svg viewBox="0 0 600 380" role="img" aria-label="${g.baslik}">
    <rect width="600" height="380" rx="16" fill="#cfeac4"/>
    <path d="M0,120 C80,110 120,40 200,30 M300,0 C330,60 390,50 470,40 M0,330 C40,300 60,260 130,280" stroke="#bfe0b2" stroke-width="22" fill="none" stroke-linecap="round"/>
    <path d="M600,0 L600,380 L440,380 C480,330 520,250 525,170 C530,100 560,40 600,0Z" fill="#8fd0f2"/>
    <path class="dalga" d="M540,120 q8 -5 16 0 t16 0 t16 0 t16 0 M520,240 q8 -5 16 0 t16 0 t16 0 t16 0 t16 0" stroke="#fff" stroke-width="2.5" fill="none" opacity=".7"/>
    <text x="565" y="205" text-anchor="middle" style="font:700 15px var(--font-d)" fill="#1262b3">Deniz</text>
    <path d="${dere}" stroke="#ff9a1f" stroke-width="104" stroke-linecap="round" fill="none" opacity=".22"/>
    <path d="${asagi}" stroke="#ec4f4c" stroke-width="52" stroke-linecap="round" fill="none" opacity=".32"/>
    <path d="M10,262 L480,248" stroke="#8a97a8" stroke-width="11" stroke-linecap="round"/><path d="M10,262 L480,248" stroke="#fff" stroke-width="2" stroke-dasharray="10 8"/>
    <path d="M120,380 C130,300 170,280 196,250" stroke="#8a97a8" stroke-width="7" stroke-linecap="round" fill="none"/>
    ${binalar}
    <path d="${dere}" stroke="#2f8fd8" stroke-width="7" stroke-linecap="round" fill="none"/>
    <path class="parilti" d="${dere}" stroke="#d6f0ff" stroke-width="2" stroke-linecap="round" fill="none"/>
    ${su}
    <text x="62" y="56" style="font:700 15px var(--font-d)" fill="#1262b3">Dere</text>
    <text x="28" y="252" style="font:600 13px var(--font-b)" fill="#56688a">Ana cadde</text>
    ${noktalar}
  </svg></div>`;
}

function noktaGoster(el) {
  const i = +el.dataset.i, p = HARITA_NOKTALARI[i], kap = el.closest(".gorsel");
  const yeni = !incelenen.has(i);
  incelenen.add(i);
  kap.querySelectorAll(".nokta").forEach(n => n.classList.toggle("secili", n === el));
  el.classList.add("goruldu"); el.querySelector("text").textContent = "✓";
  kap.querySelector(".ipucu-cubuk i").style.width = (incelenen.size / HARITA_NOKTALARI.length * 100) + "%";
  kap.querySelector(".ipucu-sayi").textContent = `${incelenen.size}/${HARITA_NOKTALARI.length}`;
  kap.querySelector(".harita-bilgi").innerHTML = `<b>${i + 1}. ${p.ad}</b><span class="chip ${p.risk === "yuksek" ? "riskli" : p.risk === "orta" ? "kismi" : "guclu"}" style="margin:4px 0 6px">${RISK_ADI[p.risk]}</span><br>${p.bilgi}`;
  sesCal("tik");
  if (yeni && incelenen.size === HARITA_NOKTALARI.length) {
    const r = ROZETLER.find(x => x.id === "dedektif");
    setTimeout(() => { toast(r); sesCal("rozet"); konfeti(50); }, 300);
  }
}

/* ---------- Bildirim ve konfeti ---------- */
function toast(r) {
  const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status");
  t.innerHTML = `${madalya(r, 54)}<div><b>Rozet kazandın: ${r.ad}!</b><span>${r.aciklama}</span></div>`;
  document.body.appendChild(t); setTimeout(() => t.remove(), 3500);
}
function konfeti(n) {
  if (hareketAzalt) return;
  const k = document.createElement("div"); k.className = "konfeti"; k.setAttribute("aria-hidden", "true");
  const renk = ["#1e88e5", "#ffd23f", "#22a866", "#ec4f4c", "#7c55c7", "#ff9a1f"];
  for (let i = 0; i < n; i++) {
    const p = document.createElement("i");
    p.style.left = rnd(0, 100) + "%"; p.style.background = renk[i % renk.length];
    p.style.animationDuration = rnd(1.8, 3.4) + "s"; p.style.animationDelay = rnd(0, .6) + "s";
    p.style.transform = `rotate(${rnd(0, 360)}deg)`;
    k.appendChild(p);
  }
  document.body.appendChild(k); setTimeout(() => k.remove(), 4400);
}

/* ---------- Olaylar ---------- */
app.addEventListener("click", e => {
  const b = e.target.closest("[data-eylem]"); if (!b || b.disabled) return;
  const i = +b.dataset.i;
  switch (b.dataset.eylem) {
    case "baslat": baslat(); break;
    case "ileri": ileri(); break;
    case "atla": { const el = document.getElementById("balon-metin"); if (el) yaziyiTamamla(el); gorevAc(); break; }
    case "sec": sec(i); break;
    case "devam": devam(); break;
    case "geri": oncekiKarar(); break;
    case "kararaDon": S.ekran = "oyun"; kararaDon(i); break;
    case "yenidenSor": S.onay = true; ciz(); break;
    case "vazgec": S.onay = false; ciz(); break;
    case "anaEkran": S = yeniDurum(); ciz(); window.scrollTo({ top: 0 }); break;
    case "nokta": noktaGoster(b); break;
    case "ses": { ses = !ses; sesCal("iyi"); b.innerHTML = ikon(ses ? "sesAcik" : "sesKapali", "", 24); b.setAttribute("aria-pressed", ses); b.setAttribute("aria-label", ses ? "Sesi kapat" : "Sesi aç"); b.title = ses ? "Ses açık" : "Ses kapalı"; break; }
  }
});
app.addEventListener("keydown", e => {
  const g = e.target.closest && e.target.closest(".nokta");
  if (g && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); noktaGoster(g); }
});

ciz();
</script>
